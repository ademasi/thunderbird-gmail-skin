<body><main><h1>Thunder-G</h1><h2>Layout</h2>
<label><input id="hide-today-pane" type="checkbox"> Hide Today Pane completely</label>
<p>Hide the calendar pane, its splitter, and the bottom-right toggle. Applies immediately to all windows.</p>
<p>Turn this off to restore Thunderbird’s existing visibility setting. That setting is never changed.</p>
